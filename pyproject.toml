[project]
name = "flashim"
version = "0.0.1"
description = "FlashIM: fast, quantized, multi-platform inference for image matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision>=0.23.0",
    "triton==3.6.0 ; sys_platform == 'linux'",
    "einops>=0.8.1",
    "numpy>=2.0",
    "pillow>=12.0.0",
    "safetensors>=0.5",
]

[project.optional-dependencies]
eval = [
    "hardmatch>=1.0.0",
    "opencv-python>=4.12.0.88",
    "poselib>=2.0.4",  # LO-RANSAC of the unified pose-accuracy protocol (benchmarks/accuracy/run_sparse.py)
    "tqdm>=4.67.1",
]
tilelang = [
    "tilelang==0.1.14 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.5",
    "kornia>=0.8",  # oracle of the DISK / LoFTR parity tests
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: needs a CUDA device",
    "sm120: needs compute capability >= 12.0 (MXFP8 scaled_mm)",
    "weights: needs the romav2.0.1.pt checkpoint",
    "oracle: needs the romav2 reference package (not a dependency: `uv pip install -e ../RoMaV2`)",
    "slow: long-running (full model / benchmarks)",
]

[tool.ruff]
line-length = 110
