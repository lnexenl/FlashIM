[project]
name = "flashim"
version = "0.1.0"
description = "FlashIM: fast, quantized, multi-platform inference for image matching"
readme = "README.md"
# FlashIM is Apache-2.0; code ported from RoMaV2 is MIT, the DINOv3 / DPT code it took from Meta is under the DINOv3
# License (THIRD_PARTY_NOTICES.md, licenses/)
license = "Apache-2.0 AND MIT AND LicenseRef-DINOv3"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "lnexenl" }]
keywords = ["image matching", "feature matching", "quantization", "fp8", "int8", "triton", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# 3.10: JetPack 6's L4T torch is cp310 only (requirements-jetson.txt)
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "triton>=3.6,<3.7 ; sys_platform == 'linux'",
    "einops>=0.8.1",
    "numpy>=2.0",
    "pillow>=12.0.0",
    "safetensors>=0.5",
    "tomli>=2.0 ; python_version < '3.11'",  # TOML config files (tomllib is 3.11+)
]

[project.urls]
Homepage = "https://github.com/lnexenl/FlashIM"
Documentation = "https://github.com/lnexenl/FlashIM/tree/main/docs"
Source = "https://github.com/lnexenl/FlashIM"
Issues = "https://github.com/lnexenl/FlashIM/issues"
Changelog = "https://github.com/lnexenl/FlashIM/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cv = [
    "opencv-python>=4.12.0.88",  # SIFT, ORB, flashim.geometry.pose
]
eval = [
    "hardmatch>=1.0.0",
    "opencv-python>=4.12.0.88",
    "poselib>=2.0.4",  # LO-RANSAC of the unified pose-accuracy protocol (benchmarks/accuracy/run_sparse.py)
    "tqdm>=4.67.1",
]
tilelang = [
    "tilelang==0.1.14 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.5",
    "kornia>=0.8",  # oracle of the DISK / LoFTR parity tests
    "matplotlib>=3.11.2 ; python_version >= '3.11'",
    "timm", "yacs", "pyyaml",  # imported by the vendored RDD reference (tests/oracles/rdd)
]

[build-system]
requires = ["uv_build>=0.8.15,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: needs a CUDA device",
    "sm120: needs compute capability >= 12.0 (MXFP8 scaled_mm)",
    "weights: needs the romav2.0.1.pt checkpoint",
    "oracle: needs the vendored romav2 reference package (tests/oracles/romav2)",
    "slow: long-running (full model / benchmarks)",
]

[tool.ruff]
line-length = 110
extend-exclude = ["tests/oracles"]  # vendored upstream reference code, kept as published
